name: Test Suite & Containerized E2E

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Typecheck & Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & component tests
        run: npm run test:unit

  containerized-e2e:
    name: Containerized E2E (Docker + Supabase DB + Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start Dockerized Supabase DB, PostgREST & App stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Run Playwright E2E tests against Docker containers
        env:
          CI: 'true'
          CI_CONTAINERIZED: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:4173'
          SUPABASE_TEST_URL: 'http://localhost:54321'
        run: npm run test:e2e

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Tear down Docker containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
