name: Test Suite & Containerized E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: Typecheck & Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & component tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Publish Vitest Job Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryPath || !fs.existsSync("vitest-results.json")) process.exit(0);
            const data = JSON.parse(fs.readFileSync("vitest-results.json", "utf8"));
            const passed = data.numPassedTests || 0;
            const failed = data.numFailedTests || 0;
            const total = data.numTotalTests || 0;
            const badge = failed === 0 ? "✅ PASSED" : "❌ FAILED";
            const lines = [
              `## ${badge} — Unit, Component & WebSocket Tests (${passed}/${total})`,
              "",
              "| Status | Suite | Test Case | Duration |",
              "| :---: | :--- | :--- | :---: |"
            ];
            for (const suite of data.testResults || []) {
              const suiteName = (suite.name || "").split("/src/").pop() || suite.name;
              for (const t of suite.assertionResults || []) {
                const icon = t.status === "passed" ? "✅" : t.status === "failed" ? "❌" : "⏭️";
                const dur = typeof t.duration === "number" ? `${Math.round(t.duration)}ms` : "-";
                const title = [ ...(t.ancestorTitles || []), t.title ].join(" › ").replace(/\|/g, "\\|");
                lines.push(`| ${icon} | \`${suiteName}\` | ${title} | ${dur} |`);
              }
            }
            lines.push("");
            fs.appendFileSync(summaryPath, lines.join("\n"));
          '

  containerized-e2e:
    name: Containerized E2E (Docker + Supabase DB + Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start Dockerized Supabase DB, PostgREST & App stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Run Playwright E2E tests against Docker containers
        env:
          CI: 'true'
          CI_CONTAINERIZED: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:4173'
          SUPABASE_TEST_URL: 'http://localhost:54321'
        run: npm run test:e2e

      - name: Publish Playwright E2E Job Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryPath || !fs.existsSync("playwright-results.json")) process.exit(0);
            const data = JSON.parse(fs.readFileSync("playwright-results.json", "utf8"));
            const rows = [];
            let passed = 0;
            let failed = 0;
            function walkSuites(suites, parents = []) {
              for (const s of suites || []) {
                const nextParents = s.title ? [...parents, s.title] : parents;
                for (const spec of s.specs || []) {
                  const res = spec.tests?.[0]?.results?.[0];
                  const status = res?.status || (spec.ok ? "passed" : "failed");
                  if (status === "passed") passed++;
                  else if (status !== "skipped") failed++;
                  const icon = status === "passed" ? "✅" : status === "skipped" ? "⏭️" : "❌";
                  const durMs = res?.duration || 0;
                  const dur = durMs >= 1000 ? `${(durMs / 1000).toFixed(1)}s` : `${Math.round(durMs)}ms`;
                  const suiteTitle = nextParents.slice(1).join(" › ") || "E2E";
                  rows.push(`| ${icon} | ${suiteTitle.replace(/\|/g, "\\|")} | ${spec.title.replace(/\|/g, "\\|")} | ${dur} |`);
                }
                walkSuites(s.suites, nextParents);
              }
            }
            walkSuites(data.suites);
            const total = passed + failed;
            const badge = failed === 0 ? "✅ PASSED" : "❌ FAILED";
            const lines = [
              `## ${badge} — Containerized E2E & Browser Suite (${passed}/${total})`,
              "",
              "| Status | Suite | Browser / DB Journey | Duration |",
              "| :---: | :--- | :--- | :---: |",
              ...rows,
              ""
            ];
            fs.appendFileSync(summaryPath, lines.join("\n"));
          '

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Tear down Docker containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
