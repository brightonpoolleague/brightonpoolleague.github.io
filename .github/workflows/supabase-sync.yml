name: Sync Supabase Schema

on:
  workflow_run:
    workflows: ["Test Suite & Containerized E2E"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-schema:
    name: Apply supabase/schema.sql to Supabase
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Check if schema.sql changed
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -qE '^(supabase/schema\.sql|\.github/workflows/supabase-sync\.yml)$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to supabase/schema.sql in this push — skipping sync."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply schema.sql via Supabase Management API
        if: steps.check_changes.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: sttjprycpauamxkiwqit
        run: |
          node -e '
            const fs = require("fs");
            const token = process.env.SUPABASE_ACCESS_TOKEN;
            const ref = process.env.SUPABASE_PROJECT_REF;
            if (!token) {
              console.error("Error: SUPABASE_ACCESS_TOKEN secret is not set in GitHub Repository Secrets.");
              process.exit(1);
            }
            const query = fs.readFileSync("supabase/schema.sql", "utf8");
            fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ query })
            }).then(async (res) => {
              const text = await res.text();
              if (!res.ok) {
                console.error(`Supabase API returned ${res.status}: ${text}`);
                process.exit(1);
              }
              console.log("Successfully applied supabase/schema.sql to Supabase project:", ref);
            }).catch((err) => {
              console.error("Failed to connect to Supabase API:", err);
              process.exit(1);
            });
          '
