services:
  supabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - ./docker/01-supabase-roles.sql:/docker-entrypoint-initdb.d/01-supabase-roles.sql:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./docker/03-test-seed.sql:/docker-entrypoint-initdb.d/03-test-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  supabase-rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"

  supabase-gateway:
    image: nginx:1.27-alpine
    depends_on:
      - supabase-rest
    ports:
      - "54321:54321"
    volumes:
      - ./docker/nginx-supabase.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:54321/rest/v1/seasons?select=id || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: http://localhost:54321
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        VITE_FORCE_SUPABASE: "true"
    depends_on:
      supabase-gateway:
        condition: service_healthy
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
